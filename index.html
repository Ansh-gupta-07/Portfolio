      {
        id: "05",

        tags: ["JavaScript", "DNS", "API", "DevTools"],

      {

        tags: ["Linux", "Arch", "Shell", "Security"],

      {

        desc: "This very portfolio — a dark-mode editorial site built with React, GSAP animations, and zero build tools.",
        tags: ["React", "GSAP", "CSS", "Design"],
        color: "#2a2418",
        glow: "rgba(200,169,126,0.25)",
        accent: "#c8a97e",
        label: "PORTFOLIO",
        link: "https://github.com/Ansh-gupta-07/Portfolio",
        stars: 2,
      },
    ];

    const SKILLS = [
      { icon: "⚡", title: "Frontend", desc: "React, Next.js, TypeScript, Three.js, GSAP, Tailwind" },
      { icon: "🛠", title: "Backend", desc: "Node.js, Express, Python, FastAPI, PostgreSQL, MongoDB" },
      { icon: "🤖", title: "AI / ML", desc: "TensorFlow.js, Scikit-learn, OpenAI API, Edge inference" },
      { icon: "☁️", title: "DevOps", desc: "Docker, GitHub Actions, Vercel, AWS, CI/CD pipelines" },
    ];

    const TECH = ["React","Node.js","TypeScript","Python","MongoDB","Tailwind CSS","PostgreSQL","Next.js","Express","Three.js","GSAP","Docker"];

    const SOCIALS = [
      { label: "GitHub",    href: "https://github.com/Ansh-gupta-07" },
      { label: "LinkedIn",  href: "https://www.linkedin.com/in/ansh-gupta-406381294/" },
      { label: "Instagram", href: "https://www.instagram.com/ANSH_GUPTA_17_08/" },
    ];

    // ─────────────────────────────────────────────
    // CURSOR
    // ─────────────────────────────────────────────
    const Cursor = () => {
      const dotRef    = useRef(null);
      const ringRef   = useRef(null);
      const mouse     = useRef({ x: 0, y: 0 });
      const follower  = useRef({ x: 0, y: 0 });
      const rafId     = useRef(null);

      useEffect(() => {
        const dot  = dotRef.current;
        const ring = ringRef.current;
        if (!dot || !ring) return;

        const onMove = (e) => {
          mouse.current.x = e.clientX;
          mouse.current.y = e.clientY;
          gsap.set(dot, { x: e.clientX, y: e.clientY });
        };

        const animate = () => {
          follower.current.x += (mouse.current.x - follower.current.x) * 0.12;
          follower.current.y += (mouse.current.y - follower.current.y) * 0.12;
          gsap.set(ring, { x: follower.current.x, y: follower.current.y });
          rafId.current = requestAnimationFrame(animate);
        };

        document.addEventListener("mousemove", onMove);
        rafId.current = requestAnimationFrame(animate);

        const hoverIn  = () => { gsap.to(dot,  { scale: 2.5, duration: 0.3, ease: "back.out" }); gsap.to(ring, { scale: 1.5, opacity: 0.6, duration: 0.3 }); };
        const hoverOut = () => { gsap.to(dot,  { scale: 1,   duration: 0.3 }); gsap.to(ring, { scale: 1,   opacity: 1,   duration: 0.3 }); };

        document.querySelectorAll("a, button, [data-magnetic]").forEach(el => {
          el.addEventListener("mouseenter", hoverIn);
          el.addEventListener("mouseleave", hoverOut);
        });

        return () => {
          document.removeEventListener("mousemove", onMove);
          cancelAnimationFrame(rafId.current);
        };
      }, []);

      return (
        <>
          <div className="cursor"          ref={dotRef}  />
          <div className="cursor-follower" ref={ringRef} />
        </>
      );
    };

    // ─────────────────────────────────────────────
    // NAV
    // ─────────────────────────────────────────────
    const Nav = () => {
      const navRef = useRef(null);

      useEffect(() => {
        gsap.registerPlugin(ScrollTrigger);
        const nav = navRef.current;
        if (!nav) return;
        ScrollTrigger.create({
          start: "top -60",
          onEnter:     () => nav.classList.add("scrolled"),
          onLeaveBack: () => nav.classList.remove("scrolled"),
        });
      }, []);

      return (
        <nav className="nav" ref={navRef} id="nav">
          <div className="nav-logo">
            <a href="#hero" className="nav-name" data-magnetic>AG</a>
            <span className="nav-full-name">Ansh Gupta</span>
          </div>
          <div className="nav-links">
            {["Work","About","Contact"].map(l => (
              <a key={l} href={`#${l.toLowerCase()}`} className="nav-link" data-magnetic>{l}</a>
            ))}
          </div>
          <div className="nav-status">
            <span className="status-dot" />
            <span>Available for work</span>
          </div>
        </nav>
      );
    };

    // ─────────────────────────────────────────────
    // HERO
    // ─────────────────────────────────────────────
    const Hero = () => {
      const sectionRef  = useRef(null);
      const portraitRef = useRef(null);
      const innerRef    = useRef(null);

      useEffect(() => {
        gsap.registerPlugin(ScrollTrigger);
        const ctx = gsap.context(() => {
          // Entrance
          const tl = gsap.timeline({ defaults: { ease: "expo.out" } });
          gsap.set(".hero-word",     { y: 80,  opacity: 0 });
          gsap.set(".hero-desc",     { y: 20,  opacity: 0 });
          gsap.set(".hero-cta-wrap", { y: 20,  opacity: 0 });
          gsap.set(".hero-portrait-wrap", { y: 30, opacity: 0 });
          gsap.set(".hero-eyebrow",  { opacity: 0 });
          gsap.set(".hero-bottom",   { opacity: 0 });

          tl.to(".hero-portrait-wrap", { opacity: 1, y: 0, duration: 1.4, delay: 0.2 })
            .to(".hero-word",          { opacity: 1, y: 0, duration: 1,   stagger: 0.12 }, "-=1.0")
            .to(".hero-eyebrow",       { opacity: 1, duration: 0.8 }, "-=0.7")
            .to(".hero-desc",          { opacity: 1, y: 0, duration: 0.8 }, "-=0.7")
            .to(".hero-cta-wrap",      { opacity: 1, y: 0, duration: 0.6 }, "-=0.5")
            .to(".hero-bottom",        { opacity: 1, duration: 0.8 }, "-=0.4");

          // BG word parallax
          gsap.to(".hero-bg-word", {
            y: -160, ease: "none",
            scrollTrigger: { trigger: ".hero", start: "top top", end: "bottom top", scrub: 1.5 },
          });

          // Portrait parallax (scroll)
          gsap.to(".hero-portrait-wrap", {
            y: 80, ease: "none",
            scrollTrigger: { trigger: ".hero", start: "top top", end: "bottom top", scrub: 2 },
          });
        }, sectionRef);

        // Mouse parallax on portrait
        const handleMouse = (e) => {
          const inner = innerRef.current;
          if (!inner) return;
          const xP = (e.clientX / window.innerWidth  - 0.5) * 2;
          const yP = (e.clientY / window.innerHeight - 0.5) * 2;
          gsap.to(inner, { rotateY: xP * 8, rotateX: -yP * 5, duration: 0.6, ease: "power2.out", transformPerspective: 800 });
        };
        document.addEventListener("mousemove", handleMouse);

        return () => {
          ctx.revert();
          document.removeEventListener("mousemove", handleMouse);
        };
      }, []);

      return (
        <section className="hero" id="hero" ref={sectionRef}>
          <div className="hero-bg-text" aria-hidden="true">
            <span className="hero-bg-word">DEVELOPER</span>
          </div>

          <div className="hero-portrait-wrap" ref={portraitRef}>
            <div className="hero-portrait-inner" ref={innerRef}>
              <img src="portrait.png" alt="Ansh Gupta" className="hero-portrait-img" />
              <div className="hero-portrait-gradient" />
            </div>
            <div className="hero-portrait-tag">
              <span>Creative Dev</span>
              <span className="hero-portrait-tag-year">©2026</span>
            </div>
          </div>

          <div className="hero-text-left">
            <p className="hero-eyebrow">
              <span className="hero-eyebrow-line" />
              Full Stack Developer
            </p>
            <h1 className="hero-h1">
              <span className="hero-word">ANSH</span>
              <span className="hero-word italic">GUPTA</span>
            </h1>
          </div>

          <div className="hero-text-right">
            <p className="hero-desc">
              Crafting immersive<br/>digital experiences<br/>through code &amp; design.
            </p>
            <div className="hero-cta-wrap">
              <a href="#work" className="btn btn-dark" data-magnetic>
                <span>View Work</span>
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </a>
            </div>
          </div>

          <div className="hero-bottom">
            {SOCIALS.slice(0,2).map(s => (
              <a key={s.label} href={s.href} target="_blank" className="hero-social" rel="noreferrer">{s.label}</a>
            ))}
            <div className="hero-scroll-hint">
              <div className="scroll-line" />
              <span>Scroll</span>
            </div>
          </div>
        </section>
      );
    };

    // ─────────────────────────────────────────────
    // MARQUEE
    // ─────────────────────────────────────────────
    const MarqueeStrip = () => {
      const items = [...TECH, ...TECH];
      return (
        <div className="marquee-section" aria-hidden="true">
          <div className="marquee-track">
            <div className="marquee-inner">
              {items.map((t, i) => (
                <React.Fragment key={i}>
                  <span>{t}</span>
                  <span className="marquee-sep">✦</span>
                </React.Fragment>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // ─────────────────────────────────────────────
    // FEATURED PROJECT (hero card at top)
    // ─────────────────────────────────────────────
    const FeaturedProject = ({ project }) => {
      const cardRef = useRef(null);

      const handleMouseMove = (e) => {
        const card = cardRef.current;
        if (!card) return;
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const rotateX = -((y - rect.height / 2) / (rect.height / 2)) * 3;
        const rotateY = ((x - rect.width / 2) / (rect.width / 2)) * 4;
        gsap.to(card, { rotateX, rotateY, duration: 0.4, ease: "power2.out", transformPerspective: 1200 });
      };

      const handleMouseLeave = () => {
        const card = cardRef.current;
        if (!card) return;
        gsap.to(card, { rotateX: 0, rotateY: 0, duration: 0.6, ease: "elastic.out(1, 0.6)" });
      };

      return (
        <article
          className="featured-card"
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
        >
          <div className="featured-card-bg" style={{
            background: `linear-gradient(135deg, ${project.color} 0%, #0d0d0d 60%, ${project.color}44 100%)`,
          }}>
            <div className="featured-glow" style={{
              background: `radial-gradient(ellipse at 30% 50%, ${project.glow} 0%, transparent 60%)`,
            }} />
            <span className="featured-bg-label" style={{ color: project.accent + "15" }}>{project.label}</span>
          </div>
          <div className="featured-content">
            <div className="featured-eyebrow">
              <span className="featured-badge">★ Featured Project</span>
              <span className="featured-num">{project.id}</span>
            </div>
            <h3 className="featured-title">{project.title}</h3>
            <p className="featured-desc">{project.desc}</p>
            <div className="featured-meta">
              <div className="project-tags">
                {project.tags.map(t => <span key={t}>{t}</span>)}
              </div>
              <div className="featured-stats">
                {project.stars && (
                  <span className="project-stat">
                    <svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14"><path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg>
                    {project.stars}
                  </span>
                )}
                {project.forks && (
                  <span className="project-stat">
                    <svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14"><path d="M5 3.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm0 2.122a2.25 2.25 0 10-1.5 0v.878A2.25 2.25 0 005.75 8.5h1.5v2.128a2.251 2.251 0 101.5 0V8.5h1.5a2.25 2.25 0 002.25-2.25v-.878a2.25 2.25 0 10-1.5 0v.878a.75.75 0 01-.75.75h-4.5A.75.75 0 015 6.25v-.878zm3.75 7.378a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm3-8.75a.75.75 0 10-1.5 0 .75.75 0 001.5 0z"/></svg>
                    {project.forks}
                  </span>
                )}
              </div>
            </div>
            <div className="featured-actions">
              <a href={project.link} target="_blank" className="btn btn-dark" rel="noreferrer" data-magnetic>
                <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                <span>View on GitHub</span>
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" width="16" height="16">
                  <path d="M7 17L17 7M17 7H7M17 7v10" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </a>
            </div>
          </div>
          <div className="featured-accent-line" style={{ background: `linear-gradient(90deg, transparent, ${project.accent}, transparent)` }} />
        </article>
      );
    };

    // ─────────────────────────────────────────────
    // PROJECT CARD (bento grid cards)
    // ─────────────────────────────────────────────
    const ProjectCard = ({ project, size }) => {
      const cardRef = useRef(null);
      const glowRef = useRef(null);

      const handleMouseMove = (e) => {
        const card = cardRef.current;
        const glow = glowRef.current;
        if (!card) return;
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const rotateX = -((y - rect.height / 2) / (rect.height / 2)) * 5;
        const rotateY = ((x - rect.width / 2) / (rect.width / 2)) * 7;
        gsap.to(card, { rotateX, rotateY, duration: 0.3, ease: "power2.out", transformPerspective: 900 });
        if (glow) gsap.to(glow, { x: x - 150, y: y - 150, opacity: 1, duration: 0.3 });
      };

      const handleMouseLeave = () => {
        const card = cardRef.current;
        const glow = glowRef.current;
        if (!card) return;
        gsap.to(card, { rotateX: 0, rotateY: 0, duration: 0.6, ease: "elastic.out(1, 0.6)" });
        if (glow) gsap.to(glow, { opacity: 0, duration: 0.4 });
      };

      const cardStyle = {
        background: `linear-gradient(135deg, ${project.color} 0%, #0d0d0d 100%)`,
        position: "relative",
      };

      return (
        <article
          className={`project-card ${size || ""}`}
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
        >
          {/* Cursor-following glow */}
          <div className="card-cursor-glow" ref={glowRef} style={{
            background: `radial-gradient(circle, ${project.glow} 0%, transparent 70%)`,
          }} />
          <div className="project-card-inner">
            <div className="project-card-img-wrap">
              <div className="project-card-img" style={cardStyle}>
                <span style={{
                  position:"absolute", inset:0, display:"flex", alignItems:"center",
                  justifyContent:"center", fontFamily:"'Bebas Neue',sans-serif",
                  fontSize:"clamp(24px,3.5vw,48px)", color: project.accent + "20", letterSpacing:"0.1em",
                }}>
                  {project.label}
                </span>
                <div style={{
                  position: "absolute",
                  width: "200px", height: "200px",
                  background: `radial-gradient(circle, ${project.glow} 0%, transparent 70%)`,
                  top: "50%", left: "50%",
                  transform: "translate(-50%, -50%)",
                  borderRadius: "50%",
                  pointerEvents: "none",
                }} />
              </div>
              <div className="project-card-overlay">
                <a href={project.link} target="_blank" className="project-link-btn" rel="noreferrer" aria-label="View on GitHub">
                  <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                </a>
                {project.liveLink && (
                  <a href={project.liveLink} target="_blank" className="project-link-btn project-live-btn" rel="noreferrer" aria-label="View live">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  </a>
                )}
              </div>
            </div>
            <div className="project-card-info">
              <span className="project-num">{project.id}</span>
              <div>
                <h3 className="project-title">{project.title}</h3>
                <p className="project-desc">{project.desc}</p>
                <div className="project-card-bottom">
                  <div className="project-tags">
                    {project.tags.map(t => <span key={t}>{t}</span>)}
                  </div>
                  <div className="project-stats-row">
                    {project.stars && (
                      <span className="project-stat">
                        <svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12"><path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg>
                        {project.stars}
                      </span>
                    )}
                    {project.forks && (
                      <span className="project-stat">
                        <svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12"><path d="M5 3.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm0 2.122a2.25 2.25 0 10-1.5 0v.878A2.25 2.25 0 005.75 8.5h1.5v2.128a2.251 2.251 0 101.5 0V8.5h1.5a2.25 2.25 0 002.25-2.25v-.878a2.25 2.25 0 10-1.5 0v.878a.75.75 0 01-.75.75h-4.5A.75.75 0 015 6.25v-.878zm3.75 7.378a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm3-8.75a.75.75 0 10-1.5 0 .75.75 0 001.5 0z"/></svg>
                        {project.forks}
                      </span>
                    )}
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div className="card-accent-line" style={{
            background: `linear-gradient(90deg, transparent, ${project.accent}, transparent)`,
          }} />
        </article>
      );
    };

    // ─────────────────────────────────────────────
    // WORK
    // ─────────────────────────────────────────────
    const Work = () => {
      const ref = useRef(null);
      const scrollRef = useRef(null);

      useEffect(() => {
        const ctx = gsap.context(() => {
          gsap.from(".work-section .section-label", { opacity:0, x:-20, duration:0.8, ease:"power3.out",
            scrollTrigger:{ trigger:".work-section", start:"top 88%" } });
          gsap.from(".section-h2 .reveal-text", { opacity:0, y:60, duration:1, stagger:0.1, ease:"expo.out",
            scrollTrigger:{ trigger:".section-h2", start:"top 85%" } });
          gsap.from(".featured-card", { opacity:0, y:60, duration:1.2, ease:"expo.out",
            scrollTrigger:{ trigger:".featured-card", start:"top 85%" } });
          gsap.from(".projects-bento .project-card", { opacity:0, y:50, duration:0.9, stagger:0.12, ease:"power3.out",
            scrollTrigger:{ trigger:".projects-bento", start:"top 80%" } });

          // Horizontal scroll for the bento overflow track
          const scrollEl = scrollRef.current;
          if (scrollEl && scrollEl.scrollWidth > scrollEl.clientWidth) {
            gsap.to(scrollEl, {
              scrollLeft: scrollEl.scrollWidth - scrollEl.clientWidth,
              ease: "none",
              scrollTrigger: {
                trigger: scrollEl,
                start: "top 60%",
                end: "bottom 40%",
                scrub: 1.5,
              }
            });
          }
        }, ref);
        return () => ctx.revert();
      }, []);

      const featured = PROJECTS.find(p => p.featured);
      const rest = PROJECTS.filter(p => !p.featured);
      // Assign bento sizes: index 0 and 4 are wide to create a nice 3-column dense layout
      const bentoSizes = ["card-wide", "", "", "", "card-wide", ""];

      return (
        <section className="section work-section" id="work" ref={ref}>
          <div className="section-label">
            <span className="section-number">01</span>
            <span>Selected Work</span>
          </div>
          <div className="section-header">
            <h2 className="section-h2">
              <span className="reveal-text">Projects</span>
              <span className="reveal-text italic">that ship.</span>
            </h2>
            <p className="work-subtitle">Real projects from my GitHub — click to explore the code.</p>
          </div>

          {/* Featured hero project */}
          {featured && <FeaturedProject project={featured} />}

          {/* Bento grid */}
          <div className="projects-bento" ref={scrollRef}>
            {rest.map((p, i) => (
              <ProjectCard key={p.id} project={p} size={bentoSizes[i] || ""} />
            ))}
          </div>

          <div className="work-footer">
            <a href="https://github.com/Ansh-gupta-07" target="_blank" className="btn btn-outline-accent" rel="noreferrer" data-magnetic>
              <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
              <span>View All on GitHub</span>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </a>
          </div>
        </section>
      );
    };

    // ─────────────────────────────────────────────
    // ABOUT
    // ─────────────────────────────────────────────
    const About = () => {
      const ref = useRef(null);

      useEffect(() => {
        const ctx = gsap.context(() => {
          gsap.from(".about-section .reveal-text", { opacity:0, y:60, duration:1, stagger:0.12, ease:"expo.out",
            scrollTrigger:{ trigger:".about-section .section-h2", start:"top 85%" } });
          gsap.from(".about-portrait-wrap", { opacity:0, x:40, duration:1, ease:"power3.out",
            scrollTrigger:{ trigger:".about-portrait-wrap", start:"top 85%" } });
          gsap.from(".about-bio p", { opacity:0, y:20, duration:0.7, stagger:0.15, ease:"power3.out",
            scrollTrigger:{ trigger:".about-bio", start:"top 85%" } });
          gsap.from(".stat", { opacity:0, y:20, duration:0.6, stagger:0.1, ease:"power3.out",
            scrollTrigger:{ trigger:".about-stats", start:"top 88%" } });

          // Counters
          document.querySelectorAll(".counter").forEach(el => {
            const target = parseInt(el.dataset.target, 10);
            const obj = { val: 0 };
            ScrollTrigger.create({
              trigger: el, start: "top 85%", once: true,
              onEnter: () => gsap.to(obj, {
                val: target, duration: 1.8, ease: "power2.out",
                onUpdate: () => { el.textContent = Math.round(obj.val); },
              }),
            });
          });
        }, ref);
        return () => ctx.revert();
      }, []);

      return (
        <section className="section about-section" id="about" ref={ref}>
          <div className="section-label">
            <span className="section-number">02</span>
            <span>About Me</span>
          </div>
          <div className="about-grid">
            <div className="about-left">
              <h2 className="section-h2">
                <span className="reveal-text">Solving hard</span>
                <span className="reveal-text italic">problems with</span>
                <span className="reveal-text">elegant code.</span>
              </h2>
            </div>
            <div className="about-right">
              <div className="about-portrait-wrap">
                <img src="portrait.png" alt="Ansh Gupta" className="about-portrait" />
                <div className="about-portrait-badge">
                  <span className="badge-line">Based in</span>
                  <span className="badge-val">India 🇮🇳</span>
                </div>
              </div>
              <div className="about-bio">
                <p>I'm <strong>Ansh Gupta</strong>, a full-stack developer with a passion for building products that sit at the intersection of technology and human experience.</p>
                <p>From AI-powered healthcare platforms to real-time collaborative tools, I turn complex problems into clean, scalable, and beautiful solutions.</p>
                <p>Currently open to <strong>freelance</strong> and <strong>full-time opportunities</strong> — let's build something remarkable together.</p>
              </div>
              <div className="about-stats">
                {[["7","Projects shipped"],["3","Years building"],["12","Technologies"]].map(([n,l]) => (
                  <div className="stat" key={l}>
                    <span className="stat-num counter" data-target={n}>0</span>
                    <span className="stat-label">{l}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    };

    // ─────────────────────────────────────────────
    // SKILLS
    // ─────────────────────────────────────────────
    const Skills = () => {
      const ref = useRef(null);
      useEffect(() => {
        const ctx = gsap.context(() => {
          gsap.from(".skill-block", { opacity:0, y:30, duration:0.7, stagger:0.1, ease:"power3.out",
            scrollTrigger:{ trigger:".skills-grid", start:"top 82%" } });
        }, ref);
        return () => ctx.revert();
      }, []);
      return (
        <section className="skills-section" ref={ref}>
          <div className="skills-grid">
            {SKILLS.map(s => (
              <div className="skill-block" key={s.title}>
                <div className="skill-icon">{s.icon}</div>
                <h4>{s.title}</h4>
                <p>{s.desc}</p>
              </div>
            ))}
          </div>
        </section>
      );
    };

    // ─────────────────────────────────────────────
    // CONTACT
    // ─────────────────────────────────────────────
    const Contact = () => {
      const ref = useRef(null);
      const [form, setForm] = useState({ name: "", email: "", message: "" });
      const [status, setStatus] = useState("idle"); // idle | sending | success | error
      const [validationError, setValidationError] = useState("");

      useEffect(() => {
        const ctx = gsap.context(() => {
          gsap.from(".contact-section .reveal-text", { opacity:0, y:60, duration:1, stagger:0.1, ease:"expo.out",
            scrollTrigger:{ trigger:".contact-h2", start:"top 85%" } });
          gsap.from(".contact-form-wrap", { opacity:0, y:40, duration:1, ease:"expo.out",
            scrollTrigger:{ trigger:".contact-form-wrap", start:"top 88%" } });
          gsap.from(".social-link", { opacity:0, x:-20, duration:0.6, stagger:0.1, ease:"power3.out",
            scrollTrigger:{ trigger:".contact-socials", start:"top 88%" } });
        }, ref);
        return () => ctx.revert();
      }, []);

      const handleChange = (e) => {
        setForm(prev => ({ ...prev, [e.target.name]: e.target.value }));
        if (validationError) setValidationError("");
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        
        // Frontend validation
        if (!form.name.trim() || !form.email.trim() || !form.message.trim()) {
          setValidationError("Please fill out all fields.");
          return;
        }
        
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(form.email)) {
          setValidationError("Please enter a valid email address.");
          return;
        }

        setStatus("sending");
        try {
          // Using FormSubmit.co for serverless email forwarding
          const res = await fetch("https://formsubmit.co/ajax/anshguptaproject@gmail.com", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ 
              name: form.name, 
              email: form.email, 
              message: form.message,
              _subject: "New message from Portfolio!"
            }),
          });
          
          const data = await res.json();

          if (res.ok && data.success !== "false" && data.success !== false) {
            setStatus("success");
            setForm({ name: "", email: "", message: "" });
          } else {
            setStatus("error");
            if (data.message) {
              setValidationError(data.message); // Show FormSubmit's specific error
            }
          }
        } catch {
          setStatus("error");
        }
      };

      return (
        <section className="section contact-section" id="contact" ref={ref}>
          <div className="section-label">
            <span className="section-number">03</span>
            <span>Get In Touch</span>
          </div>
          <div className="contact-inner">
            <h2 className="contact-h2">
              <span className="reveal-text">Let's build</span>
              <span className="reveal-text italic">something</span>
              <span className="reveal-text">great.</span>
            </h2>
            <div className="contact-body">
              <p className="contact-desc">
                Drop me a message — I'll get back to you within 24 hours.
              </p>

              {/* ── CONTACT FORM ── */}
              <form className="contact-form-wrap" onSubmit={handleSubmit} noValidate>
                <div className="cf-row">
                  <div className="cf-field">
                    <label className="cf-label" htmlFor="cf-name">Name</label>
                    <input
                      id="cf-name" name="name" type="text"
                      className="cf-input" placeholder="Ansh Gupta"
                      value={form.name} onChange={handleChange} required
                    />
                  </div>
                  <div className="cf-field">
                    <label className="cf-label" htmlFor="cf-email">Email</label>
                    <input
                      id="cf-email" name="email" type="email"
                      className="cf-input" placeholder="you@example.com"
                      value={form.email} onChange={handleChange} required
                    />
                  </div>
                </div>
                <div className="cf-field">
                  <label className="cf-label" htmlFor="cf-message">Message</label>
                  <textarea
                    id="cf-message" name="message"
                    className="cf-textarea" placeholder="Tell me about your project..."
                    rows="5" value={form.message} onChange={handleChange} required
                  />
                </div>

                <div className="cf-footer">
                  <button
                    type="submit"
                    className="btn btn-dark cf-submit"
                    disabled={status === "sending"}
                    data-magnetic
                  >
                    {status === "sending" ? (
                      <><span className="cf-spinner" /> Sending...</>
                    ) : (
                      <>
                        <span>Send Message</span>
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                          <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                        </svg>
                      </>
                    )}
                  </button>

                  {validationError && (
                    <div className="cf-feedback cf-error">
                      ⚠ {validationError}
                    </div>
                  )}
                  {status === "success" && (
                    <div className="cf-feedback cf-success">
                      ✓ Message sent! I'll reply soon.
                    </div>
                  )}
                  {status === "error" && (
                    <div className="cf-feedback cf-error">
                      ✗ Something went wrong. Try again.
                    </div>
                  )}
                </div>
              </form>

              <div className="contact-socials">
                {SOCIALS.map(s => (
                  <a key={s.label} href={s.href} target="_blank" className="social-link" data-magnetic rel="noreferrer">
                    <span>{s.label}</span>
                    <svg viewBox="0 0 24 24" fill="none">
                      <path d="M7 17L17 7M17 7H7M17 7v10" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  </a>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    };

    // ─────────────────────────────────────────────
    // FOOTER
    // ─────────────────────────────────────────────
    const Footer = () => (
      <footer className="footer">
        <div className="footer-left"><span>© 2026 Ansh Gupta</span></div>
        <div className="footer-center"><span className="footer-logo">AG</span></div>
        <div className="footer-right"><span>Designed &amp; Built from scratch</span></div>
      </footer>
    );

    // ─────────────────────────────────────────────
    // ROOT APP
    // ─────────────────────────────────────────────
    const App = () => {
      useEffect(() => {
        gsap.registerPlugin(ScrollTrigger);
        // Magnetic buttons
        document.querySelectorAll("[data-magnetic]").forEach(el => {
          el.addEventListener("mousemove", (e) => {
            const rect = el.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width  / 2;
            const y = e.clientY - rect.top  - rect.height / 2;
            gsap.to(el, { x: x * 0.25, y: y * 0.25, duration: 0.4, ease: "power2.out" });
          });
          el.addEventListener("mouseleave", () => {
            gsap.to(el, { x: 0, y: 0, duration: 0.6, ease: "elastic.out(1, 0.5)" });
          });
        });
      }, []);

      return (
        <>
          <div className="grain" />
          <Cursor />
          <Nav />
          <Hero />
          <MarqueeStrip />
          <Work />
          <About />
          <Skills />
          <Contact />
          <Footer />
        </>
      );
    };

    // Mount
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
